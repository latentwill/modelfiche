name: Windows release
on:
  push:
    branches: [codex/windows-release]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir apps/web install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows regression tests
        run: >-
          uv run --frozen python -m pytest -q
          apps/api/tests/test_run_lease.py
          apps/api/tests/test_windows_platform.py
          apps/api/tests/test_storage_capacity.py
          apps/api/tests/test_thumbnail_cache_capacity.py
          apps/api/tests/test_fal_credentials.py
          apps/cli/tests/test_server_lifecycle.py
          apps/cli/tests/test_desktop.py
      - name: Frontend tests
        run: pnpm --dir apps/web test
      - name: Build portable app
        shell: pwsh
        run: |
          $Version = (Get-Content pyproject.toml | Select-String '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$Version") { throw 'Tag and package version differ' }
          ./scripts/build_windows_app.ps1 -Version $Version
      - name: Smoke test extracted release
        run: uv run --frozen python scripts/windows/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: dist/windows/validation
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish verified Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Modelfiche ${GITHUB_REF_NAME} — Windows" --notes-file docs/releases/v0.1.0.md
